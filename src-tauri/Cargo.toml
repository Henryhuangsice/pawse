[package]
name = "pawse"
version = "0.1.0"
description = "Pawse — emotional-companion desktop pet"
edition = "2021"

[lib]
name = "pawse_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "macos-private-api"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
